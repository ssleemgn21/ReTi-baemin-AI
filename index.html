<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가게체크.html</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --line:#e2e5ea;
    --line-soft:#eef0f3;
    --ink:#1c2430;
    --ink-soft:#4d5766;
    --muted:#8a94a3;
    --accent:#1d6fe0;
    --accent-bg:#e8f0fd;
    --alert:#c8341f;
    --alert-bg:#fcecea;
    --done:#a3abb8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",sans-serif;
    font-size:16px;
    line-height:1.5;
    padding:0 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto}

  /* ===== 헤더 ===== */
  header{padding:28px 0 18px}
  .today{font-size:15px;color:var(--muted);margin-bottom:4px}
  .headline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:27px;letter-spacing:-.02em;font-weight:700}
  .late{
    background:var(--alert-bg);color:var(--alert);
    font-size:14px;font-weight:600;
    padding:4px 12px;border-radius:999px;
  }
  .progress{margin-top:16px}
  .progress-top{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-soft);margin-bottom:6px}
  .progress-top b{color:var(--ink);font-weight:600}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
  .bar.full span{background:#1f9d61}

  /* ===== 경고 ===== */
  .alarm{
    background:var(--alert-bg);border:1px solid #f0c4bd;color:var(--alert);
    padding:12px 16px;border-radius:10px;font-size:14.5px;margin-bottom:14px;font-weight:500;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .alarm.soft{background:#fdf4e3;border-color:#eddcb9;color:#8a6212}
  .alarm .msg{flex:1;min-width:200px}
  .alarm .act{
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;
    border:1px solid currentColor;background:none;color:inherit;
    border-radius:7px;padding:6px 14px;white-space:nowrap;
  }
  .alarm .act:hover{background:rgba(0,0,0,.05)}

  /* ===== 카테고리 칩 ===== */
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0 6px}
  .chip{
    font:inherit;font-size:14.5px;
    border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    padding:7px 14px;border-radius:999px;cursor:pointer;
    display:flex;align-items:center;gap:7px;
  }
  .chip:hover{border-color:var(--muted)}
  .chip .dot{width:9px;height:9px;border-radius:99px;flex:none}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.ghost{border-style:dashed;color:var(--muted)}

  /* ===== 입력 ===== */
  .composer{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin:16px 0 8px;display:flex;flex-direction:column;gap:12px;
  }
  .composer input[type=text]{
    font:inherit;font-size:17px;border:none;outline:none;background:none;
    width:100%;padding:4px 2px;color:var(--ink);
  }
  .composer input[type=text]::placeholder{color:var(--muted)}
  .composer-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{
    font:inherit;font-size:14.5px;border:none;background:var(--card);color:var(--ink-soft);
    padding:8px 14px;cursor:pointer;
  }
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  select,input[type=date]{
    font:inherit;font-size:14.5px;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);
  }
  .add{
    font:inherit;font-size:15px;font-weight:600;margin-left:auto;
    background:var(--ink);color:#fff;border:none;border-radius:8px;
    padding:9px 20px;cursor:pointer;
  }
  .add:hover{background:#000}

  /* ===== 목록 ===== */
  section{margin-top:26px}
  .sec-title{
    font-size:14px;font-weight:600;color:var(--muted);
    letter-spacing:.02em;margin-bottom:8px;padding-left:2px;
  }
  ul{list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  li.item{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;border-bottom:1px solid var(--line-soft);
  }
  li.item:last-child{border-bottom:none}
  .box{
    flex:none;width:26px;height:26px;border-radius:7px;
    border:2px solid #c3cad4;background:var(--card);
    cursor:pointer;position:relative;padding:0;
  }
  .box:hover{border-color:var(--accent)}
  .box[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
  .box[aria-checked="true"]::after{
    content:"";position:absolute;left:7px;top:3px;
    width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;
    transform:rotate(43deg);
  }
  .hit{ padding:9px; margin:-9px; }           /* 터치 영역 44px 확보 */
  .title{
    flex:1;min-width:0;font-size:16.5px;cursor:text;
    overflow-wrap:anywhere;
  }
  .item.checked .title{color:var(--done);text-decoration:line-through}
  .cat{
    flex:none;font-size:13px;padding:3px 10px;border-radius:999px;
    background:var(--line-soft);color:var(--ink-soft);white-space:nowrap;
  }
  .badge{
    flex:none;font-size:13px;font-weight:600;padding:3px 10px;
    border-radius:999px;white-space:nowrap;
  }
  .b-late{background:var(--alert-bg);color:var(--alert)}
  .b-today{background:var(--accent-bg);color:var(--accent)}
  .b-soon{background:var(--line-soft);color:var(--muted)}
  .del{
    flex:none;font:inherit;font-size:20px;line-height:1;
    background:none;border:none;color:#c8ced7;cursor:pointer;padding:4px 6px;border-radius:6px;
  }
  .del:hover{color:var(--alert);background:var(--alert-bg)}
  .empty{padding:22px 16px;color:var(--muted);font-size:15px;text-align:center}

  .toggle-done{
    font:inherit;font-size:14.5px;color:var(--muted);background:none;border:none;
    cursor:pointer;padding:10px 2px;display:flex;align-items:center;gap:6px;
  }
  .toggle-done:hover{color:var(--ink-soft)}

  /* ===== 설정 ===== */
  .tools{display:flex;gap:16px;margin-top:30px;padding-top:16px;border-top:1px solid var(--line)}
  .link{font:inherit;font-size:14px;color:var(--muted);background:none;border:none;cursor:pointer;padding:0}
  .link:hover{color:var(--accent);text-decoration:underline}
  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-top:14px;font-size:14.5px;
  }
  .panel h2{font-size:15px;margin-bottom:10px}
  .panel .row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
  .panel .row:last-child{border-bottom:none}
  .panel .row .name{flex:1}
  .panel .mini{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);
    color:var(--ink-soft);border-radius:6px;padding:4px 10px;cursor:pointer}
  .panel .mini:hover{border-color:var(--muted)}
  .panel .hint{color:var(--muted);font-size:13.5px;margin-top:12px;line-height:1.6}
  .panel input[type=number]{font:inherit;width:70px;border:1px solid var(--line);border-radius:6px;padding:6px 8px}

  footer{margin-top:34px;font-size:13px;color:var(--muted);line-height:1.7}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="today" id="dateLine"></div>
    <div class="headline">
      <h1>오늘 가게 할 일</h1>
      <span class="late" id="lateChip" hidden></span>
    </div>
    <div class="progress" id="progressWrap">
      <div class="progress-top"><span>매일 하는 일</span><span id="progressText"></span></div>
      <div class="bar" id="bar"><span style="width:0%"></span></div>
    </div>
  </header>

  <div id="alarms"></div>

  <div class="chips" id="chips"></div>

  <div class="composer">
    <input type="text" id="newTitle" placeholder="무엇을 해야 하나요?" autocomplete="off">
    <div class="composer-row">
      <div class="seg" role="group" aria-label="할 일 종류">
        <button type="button" id="typeRoutine" aria-pressed="true">매일 반복</button>
        <button type="button" id="typeOnce" aria-pressed="false">한 번만</button>
      </div>
      <select id="newCat" aria-label="카테고리"></select>
      <input type="date" id="newDue" aria-label="마감일" hidden>
      <button class="add" id="addBtn">추가</button>
    </div>
  </div>

  <section>
    <div class="sec-title">매일 하는 일</div>
    <ul id="routineList"></ul>
  </section>

  <section>
    <div class="sec-title">이번에 할 일</div>
    <ul id="todoList"></ul>
    <button class="toggle-done" id="toggleDone" hidden></button>
    <ul id="doneList" hidden></ul>
  </section>

  <div class="tools">
    <button class="link" id="openSettings">설정</button>
    <button class="link" id="openCats">카테고리 관리</button>
    <button class="link" id="doExport">백업 파일로 저장</button>
    <button class="link" id="doImport">백업 불러오기</button>
    <button class="link" id="doUndo" hidden>가져오기 전으로 되돌리기</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
  <div class="panel" id="settingsPanel" hidden></div>
  <div class="panel" id="catPanel" hidden></div>

  <footer id="foot"></footer>
</div>

<script>
(function(){
  "use strict";

  var KEY = "gagecheck.v1";
  var UNDO_KEY = "gagecheck.v1.beforeimport";
  var PALETTE = ["#2563eb","#7c3aed","#059669","#d97706","#dc2626","#0891b2","#c026d3","#65a30d"];

  /* ---------------- 저장소 ---------------- */

  function seed(){
    return {
      version:1,
      settings:{ dayResetHour:5, firstUseAt:new Date().toISOString(), lastBackupAt:null },
      categories:[
        {id:"c1",name:"오픈",color:"#2563eb"},
        {id:"c2",name:"마감",color:"#7c3aed"},
        {id:"c3",name:"주방/재료",color:"#059669"},
        {id:"c4",name:"발주/거래처",color:"#d97706"},
        {id:"c5",name:"행정/세무",color:"#dc2626"},
        {id:"c6",name:"기타",color:"#64748b"}
      ],
      routines:[
        {id:uid(),title:"간판·조명 켜기",categoryId:"c1",order:1,checkedOn:null},
        {id:uid(),title:"POS 시재 확인",categoryId:"c1",order:2,checkedOn:null},
        {id:uid(),title:"냉장고 온도 확인",categoryId:"c3",order:3,checkedOn:null},
        {id:uid(),title:"오늘 재료 부족한 것 체크",categoryId:"c3",order:4,checkedOn:null},
        {id:uid(),title:"매출 정산",categoryId:"c2",order:5,checkedOn:null},
        {id:uid(),title:"가스 밸브 잠그기",categoryId:"c2",order:6,checkedOn:null}
      ],
      todos:[],
      history:[]
    };
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  var storageOK = true;
  var state = load();

  function load(){
    var raw;
    try { raw = localStorage.getItem(KEY); }
    catch(e){ storageOK = false; return seed(); }

    if(!raw) return seed();

    try {
      var d = JSON.parse(raw);
      if(!d || !Array.isArray(d.categories) || !Array.isArray(d.routines) || !Array.isArray(d.todos)){
        throw new Error("shape");
      }
      d.settings = d.settings || {};
      if(typeof d.settings.dayResetHour !== "number") d.settings.dayResetHour = 5;
      if(!d.settings.firstUseAt) d.settings.firstUseAt = new Date().toISOString();
      if(!("lastBackupAt" in d.settings)) d.settings.lastBackupAt = null;
      d.history = d.history || [];
      d.version = 1;
      return d;
    } catch(e){
      // 깨진 데이터는 지우지 않고 따로 보관한다.
      try { localStorage.setItem(KEY + ".broken." + Date.now(), raw); } catch(e2){}
      return seed();
    }
  }

  function save(){
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      storageOK = true;
    } catch(e){
      storageOK = false;
      renderAlarms();
    }
  }

  /* ---------------- 영업일 계산 ---------------- */

  function pad(n){ return n < 10 ? "0" + n : "" + n; }

  function ymd(d){
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }

  // 오늘(영업일) = (지금 - dayResetHour 시간)의 날짜
  function businessToday(){
    var h = state.settings.dayResetHour;
    return ymd(new Date(Date.now() - h * 3600 * 1000));
  }

  function parseYmd(s){
    var p = String(s).split("-");
    return new Date(+p[0], +p[1]-1, +p[2]);
  }

  // b 기준으로 a가 며칠 뒤인가 (a - b)
  function dayDiff(a, b){
    return Math.round((parseYmd(a) - parseYmd(b)) / 86400000);
  }

  /* ---------------- 조회 ---------------- */

  var filterCat = null;          // null = 전체
  var newType = "routine";       // routine | once
  var showDone = false;

  function catById(id){
    for(var i=0;i<state.categories.length;i++){
      if(state.categories[i].id === id) return state.categories[i];
    }
    return null;
  }

  function fallbackCatId(){
    var etc = null;
    for(var i=0;i<state.categories.length;i++){
      if(state.categories[i].name === "기타") etc = state.categories[i];
    }
    if(etc) return etc.id;
    return state.categories.length ? state.categories[0].id : null;
  }

  function inFilter(item){
    return !filterCat || item.categoryId === filterCat;
  }

  function isRoutineDone(r){
    return r.checkedOn === businessToday();
  }

  function visibleRoutines(){
    return state.routines.filter(inFilter).sort(function(a,b){
      return (a.order||0) - (b.order||0);
    });
  }

  // 지연 0 → 오늘 1 → 예정 2 → 마감일 없음 3
  function dueRank(t){
    if(!t.dueDate) return 3;
    var d = dayDiff(t.dueDate, businessToday());
    if(d < 0) return 0;
    if(d === 0) return 1;
    return 2;
  }

  function visibleTodos(done){
    return state.todos.filter(function(t){
      return !!t.done === done && inFilter(t);
    }).sort(function(a,b){
      var ra = dueRank(a), rb = dueRank(b);
      if(ra !== rb) return ra - rb;
      if(a.dueDate && b.dueDate && a.dueDate !== b.dueDate){
        return a.dueDate < b.dueDate ? -1 : 1;
      }
      return (a.createdAt||"") < (b.createdAt||"") ? -1 : 1;
    });
  }

  function lateCount(){
    var today = businessToday(), n = 0;
    state.todos.forEach(function(t){
      if(!t.done && t.dueDate && dayDiff(t.dueDate, today) < 0) n++;
    });
    return n;
  }

  /* ---------------- 렌더 ---------------- */

  var $ = function(id){ return document.getElementById(id); };

  function render(){
    renderHeader();
    renderAlarms();
    renderChips();
    renderCatSelect();
    renderRoutines();
    renderTodos();
    if(!$("settingsPanel").hidden) renderSettings();
    if(!$("catPanel").hidden) renderCats();
    $("doUndo").hidden = !hasUndo();
    renderFoot();
  }

  function renderHeader(){
    var t = parseYmd(businessToday());
    var days = ["일","월","화","수","목","금","토"];
    $("dateLine").textContent =
      (t.getMonth()+1) + "월 " + t.getDate() + "일 " + days[t.getDay()] + "요일";

    var late = lateCount();
    var chip = $("lateChip");
    chip.hidden = late === 0;
    chip.textContent = "지연 " + late + "건";

    var all = state.routines;
    var done = all.filter(isRoutineDone).length;
    var wrap = $("progressWrap");
    wrap.hidden = all.length === 0;
    if(all.length){
      $("progressText").innerHTML = "<b>" + done + "</b> / " + all.length + " 완료";
      var pct = Math.round(done / all.length * 100);
      $("bar").firstElementChild.style.width = pct + "%";
      $("bar").classList.toggle("full", done === all.length);
    }
  }

  function alarmBox(cls, message, actionLabel, action){
    var d = document.createElement("div");
    d.className = "alarm" + (cls ? " " + cls : "");
    var m = document.createElement("span");
    m.className = "msg";
    m.textContent = message;
    d.appendChild(m);
    if(actionLabel){
      var b = document.createElement("button");
      b.className = "act";
      b.textContent = actionLabel;
      b.onclick = action;
      d.appendChild(b);
    }
    return d;
  }

  function daysSince(iso){
    if(!iso) return null;
    var t = new Date(iso).getTime();
    if(isNaN(t)) return null;
    return Math.floor((Date.now() - t) / 86400000);
  }

  function renderAlarms(){
    var box = $("alarms");
    box.innerHTML = "";

    if(!storageOK){
      box.appendChild(alarmBox(null,
        "저장에 실패했습니다. 시크릿 창이거나 브라우저가 저장을 막고 있으면 창을 닫을 때 내용이 사라집니다. 일반 창으로 열어주세요."));
      return;
    }

    var since = daysSince(state.settings.lastBackupAt);
    if(since === null){
      var used = daysSince(state.settings.firstUseAt);
      if(used !== null && used >= 3){
        box.appendChild(alarmBox("soft",
          "아직 한 번도 백업하지 않으셨어요. 브라우저 사용 기록을 지우면 내용이 함께 사라집니다.",
          "지금 백업하기", exportBackup));
      }
    } else if(since >= 7){
      box.appendChild(alarmBox("soft",
        "백업한 지 " + since + "일 됐어요.",
        "지금 백업하기", exportBackup));
    }
  }

  function renderChips(){
    var box = $("chips");
    box.innerHTML = "";

    box.appendChild(makeChip("전체", null, null));
    state.categories.forEach(function(c){
      box.appendChild(makeChip(c.name, c.id, c.color));
    });

    var add = document.createElement("button");
    add.className = "chip ghost";
    add.textContent = "+ 카테고리";
    add.onclick = addCategory;
    box.appendChild(add);
  }

  function makeChip(label, id, color){
    var b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", filterCat === id ? "true" : "false");
    if(color){
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = color;
      b.appendChild(dot);
    }
    b.appendChild(document.createTextNode(label));
    b.onclick = function(){
      filterCat = (filterCat === id) ? null : id;
      render();
    };
    return b;
  }

  function renderCatSelect(){
    var sel = $("newCat");
    var keep = sel.value;
    sel.innerHTML = "";
    state.categories.forEach(function(c){
      var o = document.createElement("option");
      o.value = c.id;
      o.textContent = c.name;
      sel.appendChild(o);
    });
    if(keep && catById(keep)) sel.value = keep;
    else if(filterCat) sel.value = filterCat;
  }

  function renderRoutines(){
    var ul = $("routineList");
    ul.innerHTML = "";
    var list = visibleRoutines();

    if(!list.length){
      ul.appendChild(emptyRow(
        filterCat ? "이 카테고리에는 매일 하는 일이 없습니다."
                  : "매일 반복하는 일을 위에서 추가해 보세요."
      ));
      return;
    }

    list.forEach(function(r){
      var done = isRoutineDone(r);
      var li = row({
        checked: done,
        title: r.title,
        catId: r.categoryId,
        onToggle: function(){
          r.checkedOn = done ? null : businessToday();
          save(); render();
        },
        onRename: function(v){ r.title = v; save(); render(); },
        onDelete: function(){
          if(!confirm("'" + r.title + "'을(를) 목록에서 지울까요?\n매일 하는 일에서 완전히 사라집니다.")) return;
          state.routines = state.routines.filter(function(x){ return x.id !== r.id; });
          save(); render();
        }
      });
      ul.appendChild(li);
    });
  }

  function renderTodos(){
    var ul = $("todoList");
    ul.innerHTML = "";
    var list = visibleTodos(false);

    if(!list.length){
      ul.appendChild(emptyRow(
        filterCat ? "이 카테고리에는 할 일이 없습니다." : "남은 할 일이 없습니다."
      ));
    } else {
      list.forEach(function(t){ ul.appendChild(todoRow(t)); });
    }

    var doneList = visibleTodos(true);
    var btn = $("toggleDone"), dul = $("doneList");
    btn.hidden = doneList.length === 0;
    btn.textContent = (showDone ? "▾ " : "▸ ") + "완료됨 (" + doneList.length + ")";
    dul.hidden = !showDone || doneList.length === 0;
    dul.innerHTML = "";
    if(showDone) doneList.forEach(function(t){ dul.appendChild(todoRow(t)); });
  }

  function todoRow(t){
    return row({
      checked: !!t.done,
      title: t.title,
      catId: t.categoryId,
      badge: dueBadge(t),
      onToggle: function(){
        t.done = !t.done;
        t.completedAt = t.done ? new Date().toISOString() : null;
        save(); render();
      },
      onRename: function(v){ t.title = v; save(); render(); },
      onDelete: function(){
        if(!confirm("'" + t.title + "'을(를) 지울까요?")) return;
        state.todos = state.todos.filter(function(x){ return x.id !== t.id; });
        save(); render();
      }
    });
  }

  function dueBadge(t){
    if(!t.dueDate || t.done) return null;
    var d = dayDiff(t.dueDate, businessToday());
    if(d < 0)  return { text: (-d) + "일 지남", cls: "b-late" };
    if(d === 0) return { text: "오늘", cls: "b-today" };
    return { text: "D-" + d, cls: "b-soon" };
  }

  function row(o){
    var li = document.createElement("li");
    li.className = "item" + (o.checked ? " checked" : "");

    var box = document.createElement("button");
    box.className = "box hit";
    box.setAttribute("role","checkbox");
    box.setAttribute("aria-checked", o.checked ? "true" : "false");
    box.setAttribute("aria-label", o.title);
    box.onclick = o.onToggle;
    li.appendChild(box);

    var title = document.createElement("div");
    title.className = "title";
    title.textContent = o.title;
    title.title = "눌러서 이름 고치기";
    title.onclick = function(){
      var v = prompt("내용 고치기", o.title);
      if(v === null) return;
      v = v.trim();
      if(v) o.onRename(v);
    };
    li.appendChild(title);

    if(o.badge){
      var b = document.createElement("span");
      b.className = "badge " + o.badge.cls;
      b.textContent = o.badge.text;
      li.appendChild(b);
    }

    var c = catById(o.catId);
    if(c){
      var cs = document.createElement("span");
      cs.className = "cat";
      cs.textContent = c.name;
      cs.style.background = c.color + "1f";
      cs.style.color = c.color;
      li.appendChild(cs);
    }

    var del = document.createElement("button");
    del.className = "del";
    del.textContent = "×";
    del.title = "지우기";
    del.setAttribute("aria-label", o.title + " 지우기");
    del.onclick = o.onDelete;
    li.appendChild(del);

    return li;
  }

  function emptyRow(text){
    var li = document.createElement("li");
    li.className = "empty";
    li.textContent = text;
    return li;
  }

  function renderFoot(){
    var since = daysSince(state.settings.lastBackupAt);
    var backupLine = (since === null)
      ? "아직 백업한 적이 없습니다."
      : (since === 0 ? "오늘 백업했습니다." : "마지막 백업 " + since + "일 전.");

    $("foot").innerHTML =
      "내용은 이 브라우저 안에 저장됩니다. <b>항상 같은 브라우저로 열어야</b> 내용이 보입니다.<br>" +
      "인터넷 사용 기록 삭제에서 '쿠키 및 기타 사이트 데이터'를 지우면 내용도 함께 지워집니다. " +
      "가끔 <b>백업 파일로 저장</b>해 두세요. &nbsp;·&nbsp; " + backupLine;
  }

  /* ---------------- 추가 ---------------- */

  function setType(t){
    newType = t;
    $("typeRoutine").setAttribute("aria-pressed", t === "routine" ? "true" : "false");
    $("typeOnce").setAttribute("aria-pressed", t === "once" ? "true" : "false");
    $("newDue").hidden = (t !== "once");
  }

  function addItem(){
    var input = $("newTitle");
    var title = input.value.trim();
    if(!title){ input.focus(); return; }

    var catId = $("newCat").value || fallbackCatId();

    if(newType === "routine"){
      var maxOrder = 0;
      state.routines.forEach(function(r){ if((r.order||0) > maxOrder) maxOrder = r.order||0; });
      state.routines.push({
        id: uid(), title: title, categoryId: catId,
        order: maxOrder + 1, checkedOn: null,
        createdAt: new Date().toISOString()
      });
    } else {
      state.todos.push({
        id: uid(), title: title, categoryId: catId,
        dueDate: $("newDue").value || null,
        done: false, completedAt: null,
        createdAt: new Date().toISOString()
      });
      $("newDue").value = "";
    }

    input.value = "";
    save(); render();
    input.focus();
  }

  /* ---------------- 카테고리 ---------------- */

  function addCategory(){
    var name = prompt("새 카테고리 이름");
    if(name === null) return;
    name = name.trim();
    if(!name) return;
    state.categories.push({
      id: uid(),
      name: name,
      color: PALETTE[state.categories.length % PALETTE.length]
    });
    save(); render();
  }

  function renderCats(){
    var p = $("catPanel");
    p.innerHTML = "<h2>카테고리 관리</h2>";

    state.categories.forEach(function(c){
      var used = countIn(c.id);
      var row = document.createElement("div");
      row.className = "row";

      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.cssText = "width:10px;height:10px;border-radius:99px;flex:none;background:" + c.color;
      row.appendChild(dot);

      var name = document.createElement("span");
      name.className = "name";
      name.textContent = c.name + (used ? "  ·  " + used + "개" : "");
      row.appendChild(name);

      var ren = document.createElement("button");
      ren.className = "mini";
      ren.textContent = "이름 바꾸기";
      ren.onclick = function(){
        var v = prompt("카테고리 이름", c.name);
        if(v === null) return;
        v = v.trim();
        if(v){ c.name = v; save(); render(); }
      };
      row.appendChild(ren);

      var del = document.createElement("button");
      del.className = "mini";
      del.textContent = "지우기";
      del.onclick = function(){ removeCategory(c); };
      row.appendChild(del);

      p.appendChild(row);
    });

    var hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "카테고리를 지워도 그 안의 할 일은 사라지지 않고 '기타'로 옮겨집니다.";
    p.appendChild(hint);
  }

  function countIn(id){
    var n = 0;
    state.routines.forEach(function(r){ if(r.categoryId === id) n++; });
    state.todos.forEach(function(t){ if(t.categoryId === id) n++; });
    return n;
  }

  function removeCategory(c){
    if(state.categories.length <= 1){
      alert("카테고리는 최소 1개는 있어야 합니다.");
      return;
    }
    var used = countIn(c.id);
    var msg = "'" + c.name + "' 카테고리를 지울까요?";
    if(used) msg += "\n안에 있는 " + used + "개는 '기타'로 옮겨집니다.";
    if(!confirm(msg)) return;

    state.categories = state.categories.filter(function(x){ return x.id !== c.id; });
    var to = fallbackCatId();
    state.routines.forEach(function(r){ if(r.categoryId === c.id) r.categoryId = to; });
    state.todos.forEach(function(t){ if(t.categoryId === c.id) t.categoryId = to; });
    if(filterCat === c.id) filterCat = null;

    save(); render();
  }

  /* ---------------- 설정 ---------------- */

  function renderSettings(){
    var p = $("settingsPanel");
    p.innerHTML = "<h2>설정</h2>";

    var row = document.createElement("div");
    row.className = "row";
    row.innerHTML = "<span class='name'>하루가 바뀌는 시각</span>";

    var inp = document.createElement("input");
    inp.type = "number";
    inp.min = "0"; inp.max = "12";
    inp.value = state.settings.dayResetHour;
    inp.onchange = function(){
      var v = parseInt(inp.value, 10);
      if(isNaN(v) || v < 0 || v > 12){ inp.value = state.settings.dayResetHour; return; }
      state.settings.dayResetHour = v;
      save(); render();
    };
    row.appendChild(inp);
    row.appendChild(document.createTextNode("시"));
    p.appendChild(row);

    var hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent =
      "이 시각이 지나야 '매일 하는 일'의 체크가 새로 풀립니다. " +
      "새벽 1시에 마감하는 가게라면 5시로 두세요. 마감 정리 중에 목록이 초기화되지 않습니다.";
    p.appendChild(hint);
  }

  /* ---------------- 백업 ---------------- */

  function countAll(d){
    return {
      routines: d.routines.length,
      todos: d.todos.length,
      total: d.routines.length + d.todos.length
    };
  }

  function exportBackup(){
    var today = businessToday();
    // 백업 시각을 먼저 찍어야 다른 PC에서 복원했을 때도 언제 받은 백업인지 남는다.
    state.settings.lastBackupAt = new Date().toISOString();
    var payload = JSON.stringify(state, null, 2);
    var blob = new Blob([payload], { type: "application/json" });
    var url = URL.createObjectURL(blob);

    var a = document.createElement("a");
    a.href = url;
    a.download = "가게체크_" + today + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);

    save(); render();
  }

  function readBackup(file){
    var reader = new FileReader();

    reader.onerror = function(){
      alert("파일을 읽지 못했습니다. 다시 시도해 주세요.");
    };

    reader.onload = function(){
      var d;
      try {
        d = JSON.parse(reader.result);
      } catch(e){
        alert("백업 파일이 아닌 것 같습니다.\n가게체크에서 저장한 .json 파일을 골라주세요.");
        return;
      }

      if(!d || !Array.isArray(d.categories) || !Array.isArray(d.routines) || !Array.isArray(d.todos)){
        alert("백업 파일이 아닌 것 같습니다.\n가게체크에서 저장한 .json 파일을 골라주세요.");
        return;
      }

      var now = countAll(state), next = countAll(d);
      var msg = "백업 파일을 불러올까요?\n\n" +
                "불러올 내용   매일 하는 일 " + next.routines + "개, 할 일 " + next.todos + "개\n" +
                "지금 내용     매일 하는 일 " + now.routines + "개, 할 일 " + now.todos + "개\n\n" +
                "지금 내용은 백업 파일 내용으로 바뀝니다.\n" +
                "바꾼 뒤에도 '가져오기 전으로 되돌리기'로 한 번 되돌릴 수 있습니다.";
      if(!confirm(msg)) return;

      try { localStorage.setItem(UNDO_KEY, JSON.stringify(state)); } catch(e){}

      d.settings = d.settings || {};
      if(typeof d.settings.dayResetHour !== "number") d.settings.dayResetHour = 5;
      if(!d.settings.firstUseAt) d.settings.firstUseAt = new Date().toISOString();
      d.settings.lastBackupAt = d.settings.lastBackupAt || null;
      d.history = d.history || [];
      d.version = 1;

      state = d;
      filterCat = null;
      save(); render();
      alert("불러왔습니다.\n매일 하는 일 " + next.routines + "개, 할 일 " + next.todos + "개.");
    };

    reader.readAsText(file, "utf-8");
  }

  function undoImport(){
    var raw;
    try { raw = localStorage.getItem(UNDO_KEY); } catch(e){ return; }
    if(!raw) return;

    if(!confirm("가져오기 직전 내용으로 되돌릴까요?\n지금 보이는 내용은 사라집니다.")) return;

    try {
      state = JSON.parse(raw);
    } catch(e){
      alert("되돌리지 못했습니다.");
      return;
    }
    try { localStorage.removeItem(UNDO_KEY); } catch(e){}
    filterCat = null;
    save(); render();
  }

  function hasUndo(){
    try { return !!localStorage.getItem(UNDO_KEY); } catch(e){ return false; }
  }

  /* ---------------- 연결 ---------------- */

  $("addBtn").onclick = addItem;
  $("newTitle").addEventListener("keydown", function(e){
    if(e.key === "Enter") addItem();
  });
  $("typeRoutine").onclick = function(){ setType("routine"); };
  $("typeOnce").onclick = function(){ setType("once"); };

  $("toggleDone").onclick = function(){ showDone = !showDone; renderTodos(); };

  $("doExport").onclick = exportBackup;
  $("doUndo").onclick = undoImport;
  $("doImport").onclick = function(){ $("importFile").click(); };
  $("importFile").onchange = function(e){
    var f = e.target.files && e.target.files[0];
    if(f) readBackup(f);
    e.target.value = "";   // 같은 파일을 다시 골라도 동작하도록
  };

  $("openSettings").onclick = function(){
    var p = $("settingsPanel");
    p.hidden = !p.hidden;
    if(!p.hidden){ $("catPanel").hidden = true; renderSettings(); }
  };
  $("openCats").onclick = function(){
    var p = $("catPanel");
    p.hidden = !p.hidden;
    if(!p.hidden){ $("settingsPanel").hidden = true; renderCats(); }
  };

  // 자정을 넘겨 계속 켜둔 경우에도 날짜가 알아서 넘어가도록 한다.
  var lastDay = businessToday();
  setInterval(function(){
    var now = businessToday();
    if(now !== lastDay){ lastDay = now; render(); }
  }, 60000);

  setType("routine");
  render();
  $("newTitle").focus();
})();
</script>
</body>
</html>
